<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TrailSled — museum game</title>
  <link rel="stylesheet" href="../../css/games.css">
  <link rel="stylesheet" href="../../css/period-announce.css">
  <link rel="stylesheet" href="../../css/year-game-ui.css">
</head>
<body>
  <div class="games-wrap">
    <header class="games-top">
      <div class="games-brand">WEB GAMES</div>
      <a href="../index.html">Lobby</a>
      <a href="index.html">Arcade</a>
      <a href="../../index.html">Hub</a>
    </header>
    <section class="games-panel">
      <div class="itt-year-game yg-shell" data-year-game data-year="2006" data-game-id="sled" data-yg-goal="Draw a trail. Ride it without crashing." data-yg-next-href="../../years/2006/sites/playable/game.html" data-yg-next-label="2006 year TrailSled">
      <h1>TrailSled</h1>
      <p style="font-size:12px;margin:0 0 8px">Museum original · draw-track sandbox genre (click points, then Ride). Not Line Rider.</p>
      <div class="play-hud">
        <button type="button" id="play-start">Ride</button>
        <button type="button" id="play-clear">Clear track</button>
        <span>Distance: <b id="play-score">0</b></span>
        <span id="play-status" style="color:#444">Click canvas to draw</span>
      </div>
      <div class="play-stage">
        <canvas id="game-canvas" width="520" height="340" data-game="sled"></canvas>
      </div>
      <div class="scoreboard" id="score-board"></div>
      <p style="font-size:11px"><a href="index.html">← Arcade</a> · <a href="../worlds/clubpenguin/index.html">Club Penguin culture</a> · <a href="../../years/2006/sites/playable/game.html">2006 year game</a></p>
      </div>
    </section>
  </div>
  <script src="../../js/games/scores.js"></script>
  <script src="../../js/games/year-game-boot.js"></script>
  <script src="../../js/games/sled.js"></script>
  <script src="../../js/games/shell.js"></script>
</body>
</html>
