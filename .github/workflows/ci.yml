name: CI

on:
  push:
    branches: [main, master, museum/1994-2020-lean]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Filesystem + config smoke
        run: python3 scripts/smoke-production.py

      - name: Internal link audit
        run: python3 scripts/audit-internal-links.py

      - name: Authenticity invariants
        run: python3 scripts/test-authenticity.py

      - name: Pipeline invariants
        run: python3 scripts/test-pipeline.py

      - name: 5× leftover contract
        run: python3 scripts/check-5x-contract.py

      - name: Mock-flow classifier
        run: node scripts/audit-mock-flows.js

      - name: All-years health matrix
        run: python3 scripts/check-all-years.py

      - name: Start static server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/itt-http.log 2>&1 &
          echo $! > /tmp/itt-http.pid
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              echo "server up"
              exit 0
            fi
            sleep 0.5
          done
          echo "server failed to start" >&2
          cat /tmp/itt-http.log || true
          exit 1

      - name: HTTP smoke
        run: python3 scripts/smoke-production.py --base http://127.0.0.1:8080

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: OSS visitor gate
        run: node scripts/oss-visitor-gate.mjs
        env:
          CI: true

      - name: Dest-true I/O e2e (empty never writes · leftover never writes the star)
        run: npx playwright test e2e/hub-years.spec.js e2e/year-start-trails.spec.js e2e/visitor-door.spec.js e2e/flow-check-pipeline.spec.js e2e/one-thing-per-year.spec.js e2e/all-years-official-10-real.spec.js e2e/leftover-3x-unique.spec.js e2e/leftover-2x-unique-links.spec.js e2e/leftover-3x-unique-links.spec.js e2e/official-leftover-2x.spec.js e2e/lean-triple-leftover.spec.js e2e/year-true-packs.spec.js e2e/2016-2018-3x-detail.spec.js e2e/2017-mvp.spec.js e2e/2019-mvp.spec.js e2e/2020-mvp.spec.js e2e/2021-mvp.spec.js e2e/2022-mvp.spec.js e2e/2022-flows.spec.js --workers=2
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
