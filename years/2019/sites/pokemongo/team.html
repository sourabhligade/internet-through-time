<!DOCTYPE html>
<html lang="en" data-itt-year="2019">
<head>
<meta charset="utf-8">
<title>Pokémon GO — choose team</title>
<link rel="stylesheet" href="../../../../css/period-2019.css">
</head>
<body bgcolor="#e3f2fd">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div class="itt19-shell theme-pogo">
 <p class="itt19-crumb"><a href="index.html">← Map</a> · <a href="catch.html">Catch</a> · <a href="battery.html">Battery</a></p>
 <h1 class="itt19-title">Choose a team</h1>
 <p class="itt19-lead">Instinct · Mystic · Valor · pick required before catch (no soft skip).</p>
 <ol class="itt19-steps" data-pogo-steps>
  <li data-step="loc"><span class="n">1</span> Location</li>
  <li class="active" data-step="team"><span class="n">2</span> Team</li>
  <li data-step="catch"><span class="n">3</span> Catch</li>
  <li data-step="save"><span class="n">4</span> Battery</li>
 </ol>
 <div class="itt19-team-grid">
  <button type="button" class="itt19-team" data-pogo-team="instinct">I<br>Instinct</button>
  <button type="button" class="itt19-team" data-pogo-team="mystic">M<br>Mystic</button>
  <button type="button" class="itt19-team" data-pogo-team="valor">V<br>Valor</button>
 </div>
 <button type="button" class="itt19-btn itt19-btn-pogo itt19-btn-block itt19-btn-lg" data-pogo-continue-team data-href="catch.html">Continue · catch (REAL gate: team required)</button>
 <p class="itt19-status" data-pogo-status></p>
 <div class="itt19-next">
  <b>Trail</b>
  <a class="itt19-btn itt19-btn-pogo" href="catch.html">Catch theater →</a>
 </div>
</div>
<script src="../../../../js/immersion-2019.js" defer></script>
