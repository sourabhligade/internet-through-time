<h1>Consumer Google+ dies</h1>
<p>April 2, 2019. Delete starts. They named the day on <b>January 30</b>.
 Announced <b>8 October 2018</b> (moved up from August after a 52.5M-class bug).
 Ninety percent of sessions had lasted less than five seconds. Inbox dies the same day.</p>
