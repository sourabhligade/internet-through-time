<!DOCTYPE html>
<html lang="en" data-itt-year="2019">
<head>
<meta charset="utf-8">
<title>Google Allo — Sep 21 2019</title>
<link rel="stylesheet" href="../../../../css/period-2019.css">
</head>
<body bgcolor="#e8f0fe">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div class="itt19-shell theme-allo">
 <p class="itt19-crumb"><a href="../../pages/home.html">Start</a> · <a href="../whatsapp/security.html">WA E2E</a></p>
 <div class="itt19-banner info"><b>Sep 21 2019</b> · smart messaging · Assistant / smart reply · no real Assistant API</div>
 <h1 class="itt19-title">Google Allo</h1>
 <p class="itt19-lead">Message required · smart reply chips · literacy · incomplete blocked.</p>
 <ol class="itt19-steps">
  <li class="active"><span class="n">1</span> Message</li>
  <li class="active"><span class="n">2</span> Literacy</li>
  <li><span class="n">3</span> Save</li>
 </ol>
 <div class="itt19-field">
  <label for="msg">Message <span style="font-weight:400;color:#888">(required)</span></label>
  <input id="msg" class="itt19-input" data-allo-msg placeholder="Hey — free later?">
 </div>
 <div class="itt19-row">
  <button type="button" class="itt19-btn itt19-btn-ghost" data-allo-chip="Sounds good!">Sounds good!</button>
  <button type="button" class="itt19-btn itt19-btn-ghost" data-allo-chip="On my way">On my way</button>
  <button type="button" class="itt19-btn itt19-btn-ghost" data-allo-chip="Maybe later">Maybe later</button>
 </div>
 <div class="itt19-panel">
  <label class="itt19-check"><input type="checkbox" data-req> Allo 2019 literacy (smart reply class)</label>
  <label class="itt19-check"><input type="checkbox" data-req> No real Google Assistant / network</label>
 </div>
 <button type="button" class="itt19-btn itt19-btn-primary itt19-btn-block itt19-btn-lg" data-itt-real-save data-storage-key="allo" data-min-req="2" data-requires="[data-req]" data-require-field="[data-allo-msg]">Send + save (REAL)</button>
 <p class="itt19-status" data-itt-real-status></p>
 <div class="itt19-list" data-allo-list></div>
 <p class="itt19-hint">key <code>itt19-allo</code> · empty message blocked</p>
</div>
<script src="../../../../js/immersion-2019.js" defer></script>
</body>
</html>
