<!DOCTYPE html>
<html lang="en" data-itt-year="2022">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Chrome habit — 2022</title>
<link rel="icon" href="../../favicon.gif" type="image/gif">
<base href="./">
<style>
.year-2022 #browser > .toolbar,
.year-2022 .browser > .toolbar,
.year-2022 .titlebar + .toolbar { display: none !important; }
.year-2022 #locationbar .toolbar { display: flex !important; flex-wrap: nowrap !important; }
.year-2022 #btn-back::before, .year-2022 #btn-forward::before,
.year-2022 #btn-reload::before, .year-2022 #btn-home::before,
.year-2022 #btn-back::after, .year-2022 #btn-forward::after,
.year-2022 #btn-reload::after, .year-2022 #btn-home::after { content: none !important; display: none !important; }
</style>
</head>
<body>
<script>
(function () {
  function killDup() {
    var keep = document.querySelector("#locationbar .toolbar");
    var bars = document.querySelectorAll(".toolbar");
    var i;
    for (i = 0; i < bars.length; i++) {
      if (keep && bars[i] !== keep && bars[i].parentNode) bars[i].parentNode.removeChild(bars[i]);
    }
  }
  killDup();
  document.addEventListener("DOMContentLoaded", killDup);
  window.setTimeout(killDup, 0);
  window.setTimeout(killDup, 50);
  window.setTimeout(killDup, 200);
  window.setTimeout(killDup, 800);
  function wireNav() {
    var api = window.ITT && ITT.activeBrowser;
    if (!api) return;
    function bind(id, fn) {
      var el = document.getElementById(id);
      if (!el || el.getAttribute("data-itt-wired") === "1") return;
      el.setAttribute("data-itt-wired", "1");
      el.addEventListener("click", function (ev) {
        ev.preventDefault();
        fn();
      });
    }
    bind("btn-home", function () { api.goHome(); });
    bind("btn-reload", function () { api.reload(); });
    bind("btn-back", function () { if (api.goBack) api.goBack(); });
    bind("btn-forward", function () { if (api.goForward) api.goForward(); });
  }
  window.setTimeout(wireNav, 100);
  window.setTimeout(wireNav, 400);
  window.setTimeout(wireNav, 900);
})();
</script>

</body>
</html>
