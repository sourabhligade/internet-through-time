<!DOCTYPE html>
<html lang="en" data-itt-year="2014">
<head>
<meta charset="utf-8">
<title>WhatsApp chats — 2014</title>
<link rel="stylesheet" href="../../../../css/period-2014.css">
</head>
<body bgcolor="#e5ddd5">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:420px;margin:12px auto;font-family:Helvetica,Arial,sans-serif;background:#fff;border:1px solid #ccc">
 <div style="background:#075e54;color:#fff;padding:10px 12px;font-weight:bold">
  Chats
  <span style="float:right;font-size:11px;font-weight:normal">
   <a href="index.html" style="color:#cfc">Home</a> ·
   <a href="about.html" style="color:#cfc">Deal</a>
  </span>
 </div>
 <div data-wa-list style="padding:10px;min-height:80px;font-size:13px;background:#e5ddd5"></div>
 <div style="padding:10px;border-top:1px solid #ccc">
  <form data-wa-send>
   <label style="font-size:11px;display:block;margin-bottom:4px">To
    <select name="who" data-wa-who>
     <option value="You">You (me)</option>
     <option value="Mom">Mom</option>
     <option value="Group · Family">Group · Family</option>
    </select>
   </label>
   <input name="text" data-wa-text placeholder="Type a message" maxlength="200" style="width:70%">
   <button type="submit" data-wa-send-btn>Send</button>
  </form>
  <div data-wa-chat-status style="font-size:11px;margin-top:6px;color:#075e54"></div>
  <p style="font-size:11px;color:#555;margin-top:8px">
   Requires install · empty Send does not write · key <code>itt14-wa-msgs</code> · no real SMS.
  </p>
 </div>
</div>
<script src="../../../../js/immersion-2014.js"></script>
</body>
</html>
