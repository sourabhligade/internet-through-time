<!DOCTYPE html>
<html lang="en" data-itt-year="2013">
<head>
<meta charset="utf-8">
<title>Snapchat Stories — October 2013</title>
<link rel="stylesheet" href="../../../../css/period-2013.css">
<script src="../../../../js/immersion-2013.js" defer></script>
</head>
<body bgcolor="#000000" text="#fffc00" link="#fff" vlink="#ccc">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:400px;margin:16px auto;font-family:Avenir,Helvetica,Arial,sans-serif;font-size:13px">
 <p style="font-size:11px"><a href="index.html">← Snapchat</a> · <a href="../../pages/home.html">Start</a></p>
 <h1 style="font-size:18px;color:#fff">My Story</h1>
 <p style="color:#aaa;font-size:12px"><b>October 3, 2013</b> — Snapchat Stories: chain snaps for <b>24 hours</b>, unlimited rewatches until they expire.
 Not Instagram Stories (2016). Classic timer snaps still core.</p>
 <div class="snap-story-rail" data-snap-story-rail style="min-height:60px;margin:12px 0">My Story · empty</div>
 <p>
  <button type="button" data-snap-story-add style="padding:10px 14px;background:#fffc00;color:#000;border:0;font-weight:bold;cursor:pointer">
   Add snap to My Story
  </button>
 </p>
 <div data-snap-story-status style="font-size:12px;color:#8f8;min-height:1.3em"></div>
 <p style="font-size:11px;color:#666"><code>itt13-snap-story</code></p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-snap-story";
  var rail = document.querySelector("[data-snap-story-rail]");
  var st = document.querySelector("[data-snap-story-status]");
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { return []; }
  }
  function render() {
    var list = load();
    if (!rail) return;
    if (!list.length) {
      rail.textContent = "My Story · empty · add a snap";
      return;
    }
    rail.innerHTML = "My Story · " + list.length + " snap(s) · 24h theater · latest " +
      new Date(list[0].ts).toLocaleTimeString();
  }
  render();
  var btn = document.querySelector("[data-snap-story-add]");
  if (btn) {
    btn.addEventListener("click", function () {
      var list = load();
      list.unshift({ kind: "snap", hours: 24, ts: Date.now() });
      try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 24))); } catch (e) {}
      render();
      var msg = "Added to Story · 24h · " + KEY;
      if (st) st.textContent = msg;
      try {
        if (window.ITT && ITT._immersionApi && ITT._immersionApi.actionFeedback) {
          ITT._immersionApi.actionFeedback(msg, { status: st, kind: "snap-story" });
        }
      } catch (e2) {}
    });
  }
});
</script>
</body>
</html>
