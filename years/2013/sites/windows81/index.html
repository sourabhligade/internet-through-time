<!DOCTYPE html>
<html lang="en" data-itt-year="2013">
<head>
<meta charset="utf-8">
<title>Windows 8.1 — October 17, 2013</title>
<link rel="stylesheet" href="../../../../css/period-2013.css">
<script src="../../../../js/immersion-2013.js" defer></script>
</head>
<body class="win81-shell">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div class="win81-start">
 <p style="font-size:11px;opacity:0.85">
  <a href="about.html">About 8.1</a> ·
  <a href="../windows8/index.html">Windows 8</a> ·
  <a href="../../pages/home.html">Start</a>
 </p>
 <h1 style="font-weight:200;font-size:32px;margin:8px 0">Windows 8.1</h1>
 <p style="font-size:14px;opacity:0.95"><b>October 17, 2013</b> — Start button returns class · Desktop still lives · tiles still the pitch.</p>
 <div class="win81-tiles">
  <div data-win81-tile style="background:#00bcf2">Mail</div>
  <div data-win81-tile style="background:#e81123">Store</div>
  <div data-win81-tile style="background:#00b294">Photos</div>
  <div data-win81-tile style="background:#00188f;border:1px solid #fff">Desktop</div>
 </div>
 <p>
  <button type="button" class="win81-startbtn" data-win81-start>Start button tour (save)</button>
  <span class="itt13-status" data-win81-status style="display:inline;margin-left:10px;color:#8f8"></span>
 </p>
 <p class="itt13-honesty" style="background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.3);color:#eef">
  <b>Honesty:</b> Win7 residual still mass · 8.1 is product/late · not sole January shell · not Windows 10.
  
 </p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-win81-tour";
  var st = document.querySelector("[data-win81-status]");
  var tiles = document.querySelectorAll("[data-win81-tile]");
  for (var i = 0; i < tiles.length; i++) {
    tiles[i].addEventListener("click", function (ev) {
      if (st) st.textContent = "Tile: " + (ev.currentTarget.textContent || "").trim();
    });
  }
  var btn = document.querySelector("[data-win81-start]");
  if (btn) btn.addEventListener("click", function () {
    try { localStorage.setItem(KEY, JSON.stringify({ startButton: true, date: "2013-10-17", ts: Date.now() })); } catch (e) {}
    var msg = "Start tour saved · " + KEY;
    if (st) st.textContent = msg;
    try {
      if (window.ITT && ITT._immersionApi && ITT._immersionApi.actionFeedback) {
        ITT._immersionApi.actionFeedback(msg, { status: st, kind: "win81" });
      }
    } catch (e2) {}
  });
});
</script>
</body>
</html>
