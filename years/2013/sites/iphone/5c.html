<!DOCTYPE html>
<html lang="en" data-itt-year="2013">
<head>
<meta charset="utf-8">
<title>iPhone 5c — colorful · September 2013</title>
<link rel="stylesheet" href="../../../../css/period-2013.css">
<script src="../../../../js/immersion-2013.js" defer></script>
</head>
<body class="ios7-shell">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:420px;margin:16px auto;padding:12px">
 <p style="font-size:11px;font-weight:400"><a href="index.html">← iPhone 5s</a> · <a href="ios7.html">iOS 7</a></p>
 <h1 style="font-size:22px">iPhone 5c</h1>
 <p style="font-size:13px;font-weight:400;color:#3c3c43">Ships <b>September 20, 2013</b> with the 5s. Colorful polycarbonate · lower price tier class · Lightning · 4″ · <b>iOS 7</b>.</p>
 <div style="display:flex;gap:8px;margin:16px 0">
  <div style="flex:1;height:52px;background:#ff3b30;border-radius:10px" title="red"></div>
  <div style="flex:1;height:52px;background:#ffcc00;border-radius:10px" title="yellow"></div>
  <div style="flex:1;height:52px;background:#4cd964;border-radius:10px" title="green"></div>
  <div style="flex:1;height:52px;background:#5ac8fa;border-radius:10px" title="blue"></div>
  <div style="flex:1;height:52px;background:#fff;border:1px solid #c7c7cc;border-radius:10px" title="white"></div>
 </div>
 <p>
  <button type="button" class="ios7-btn" data-5c-ack style="background:#ff3b30">Save 5c interest (theater)</button>
  <span class="itt13-status" data-5c-status style="display:inline;margin-left:8px"></span>
 </p>
 <p class="itt13-ban"> · CSS color swatches only · not inventing product photography</p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-iphone5c";
  var btn = document.querySelector("[data-5c-ack]");
  var st = document.querySelector("[data-5c-status]");
  if (btn) btn.addEventListener("click", function () {
    try { localStorage.setItem(KEY, JSON.stringify({ model: "5c", ts: Date.now() })); } catch (e) {}
    var msg = "5c saved · " + KEY;
    if (st) st.textContent = msg;
    try {
      if (window.ITT && ITT._immersionApi && ITT._immersionApi.actionFeedback) {
        ITT._immersionApi.actionFeedback(msg, { status: st, kind: "5c" });
      }
    } catch (e2) {}
  });
});
</script>
</body>
</html>
