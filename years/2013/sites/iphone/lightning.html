<h1 style="font-size:18px">Lightning</h1>
<p>The 30-pin dock connector (since 2003) is replaced by <b>Lightning</b> — smaller, reversible, all-digital. Adapters available for old docks and car kits. Period culture: “new cables for everything.”</p>
<p>
 <button type="button" data-lightning-ack>I need a new cable (save)</button>
 <span data-lightning-status style="font-size:11px;color:#060;margin-left:8px"></span>
</p>
<p style="font-size:11px;color:#666">Apple Newsroom Sep 12 2013</p>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-lightning";
  var btn = document.querySelector("[data-lightning-ack]");
  var st = document.querySelector("[data-lightning-status]");
  try { if (localStorage.getItem(KEY) && st) st.textContent = "Saved · " + KEY; } catch (e) {}
  if (btn) btn.addEventListener("click", function () {
    try {
      localStorage.setItem(KEY, JSON.stringify({ connector: "Lightning", replaced: "30-pin", ts: Date.now() }));
    } catch (e2) {}
    if (st) st.textContent = "Saved · Lightning · " + KEY;
  });
});
</script>
