<!DOCTYPE html>
<html lang="en" data-itt-year="2013">
<head>
<meta charset="utf-8">
<title>Touch ID — iPhone 5s · 2013</title>
<link rel="stylesheet" href="../../../../css/period-2013.css">
<script src="../../../../js/immersion-2013.js" defer></script>
</head>
<body class="ios7-shell">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:400px;margin:16px auto;padding:12px;text-align:center">
 <p style="font-size:11px;text-align:left;font-weight:400">
  <a href="index.html">← iPhone 5s</a> · <a href="ios7.html">iOS 7</a> · <a href="../../pages/home.html">Start</a>
 </p>
 <h1 style="font-size:24px">Touch ID</h1>
 <p style="font-size:13px;font-weight:400;color:#3c3c43">iPhone 5s · September 2013 · fingerprint sensor in the Home button · pairs with <b>iOS 7</b>.</p>
 <div style="width:72px;height:72px;border-radius:36px;border:3px solid #c7c7cc;margin:20px auto;background:#fff;box-shadow:inset 0 0 0 8px #f2f2f7" title="RECON Home button — not Face ID"></div>
 <p style="font-size:12px;color:#8e8e93">Enroll theater · no real biometrics · not Face ID</p>
 <p>
  <button type="button" class="ios7-btn" data-touchid-enroll>Enroll fingerprint (theater)</button>
 </p>
 <div class="itt13-status" data-touchid-status></div>
 
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-touchid";
  var btn = document.querySelector("[data-touchid-enroll]");
  var st = document.querySelector("[data-touchid-status]");
  if (btn) btn.addEventListener("click", function () {
    try { localStorage.setItem(KEY, JSON.stringify({ enrolled: true, model: "5s", ts: Date.now() })); } catch (e) {}
    var msg = "Touch ID enrolled (theater) · " + KEY;
    if (st) st.textContent = msg;
    try {
      if (window.ITT && ITT._immersionApi && ITT._immersionApi.actionFeedback) {
        ITT._immersionApi.actionFeedback(msg, { status: st, kind: "touchid" });
      }
    } catch (e2) {}
  });
});
</script>
</body>
</html>
