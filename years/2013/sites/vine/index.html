<!DOCTYPE html>

<body class="vine-shell" bgcolor="#00bf8f" text="#ffffff" link="#ffff99" vlink="#eeffee">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:480px;margin:16px auto;font-family:Arial,sans-serif;font-size:13px">
 <p style="font-size:11px"><a href="../../pages/home.html" style="color:#fff">← Start</a> ·
  <a href="record.html" style="color:#fffc00"><b>Record</b></a> ·
  <a href="about.html" style="color:#fff">About Vine</a></p>
 <h1 style="font-size:22px;font-weight:normal">Vine</h1>
 <p>Make a scene · <b>up to 6 seconds</b> · loops forever · Twitter-owned · launched <b>Jan 24, 2013</b> (iOS).</p>
 <div data-vine-list style="background:#000;border-radius:8px;padding:10px;min-height:120px;margin:12px 0"></div>
 <p style="font-size:11px;opacity:0.9">Not TikTok · not Reels · not multi-minute. Storage <code>itt13-vine-posts</code>.</p>
 <p><a href="record.html" style="display:inline-block;background:#fffc00;color:#000;padding:10px 16px;text-decoration:none;font-weight:bold">Record a Vine →</a></p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-vine-posts";
  var el = document.querySelector("[data-vine-list]");
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { return []; }
  }
  function render() {
    if (!el) return;
    var list = load();
    if (!list.length) {
      el.innerHTML = "<div style='padding:24px;color:#8f8;text-align:center'>No vines yet · record a 6s loop</div>";
      return;
    }
    el.innerHTML = list.slice(0, 12).map(function (v) {
      return "<div style='border-bottom:1px solid #333;padding:8px 0'>" +
        "<div style='background:#111;height:80px;display:flex;align-items:center;justify-content:center;color:#0f8'>▶ loop · " +
        (v.secs || 6) + "s</div>" +
        "<div style='font-size:12px;margin-top:4px'>" + String(v.caption || "untitled").replace(/</g, "&lt;") + "</div></div>";
    }).join("");
  }
  render();
});
</script>
</body>
</html>
