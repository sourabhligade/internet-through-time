<!DOCTYPE html>
<html lang="en" data-itt-year="2013">
<head>
<meta charset="utf-8">
<title>Record a Vine — 6 seconds</title>
<link rel="stylesheet" href="../../../../css/period-2013.css">
<script src="../../../../js/immersion-2013.js" defer></script>
</head>
<body bgcolor="#111" text="#fff" link="#fffc00">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:420px;margin:20px auto;font-family:Arial,sans-serif;font-size:13px;text-align:center">
 <p style="font-size:11px;text-align:left"><a href="index.html">← Vine</a></p>
 <h1 style="font-size:18px">Hold to record · max 6s</h1>
 <div data-vine-progress style="height:8px;background:#333;margin:12px 0;border-radius:4px;overflow:hidden">
  <div data-vine-bar style="height:100%;width:0;background:#00bf8f"></div>
 </div>
 <button type="button" data-vine-hold style="width:120px;height:120px;border-radius:60px;border:4px solid #00bf8f;background:#222;color:#fff;font-size:14px;cursor:pointer">Hold</button>
 <p style="margin-top:12px">
  <input type="text" data-vine-caption placeholder="Caption…" style="width:90%;padding:8px;font-size:13px">
 </p>
 <p><button type="button" data-vine-post style="padding:8px 16px;background:#fffc00;color:#000;border:0;font-weight:bold;cursor:pointer">Post Vine</button></p>
 <div data-vine-status style="font-size:12px;color:#8f8;min-height:1.4em;margin-top:8px"></div>
 <p style="font-size:11px;color:#888">Theater only · no real camera CDN · <code>itt13-vine-posts</code></p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-vine-posts";
  var hold = document.querySelector("[data-vine-hold]");
  var bar = document.querySelector("[data-vine-bar]");
  var st = document.querySelector("[data-vine-status]");
  var post = document.querySelector("[data-vine-post]");
  var cap = document.querySelector("[data-vine-caption]");
  var secs = 0;
  var timer = null;
  var MAX = 6;
  function setBar(s) {
    secs = Math.min(MAX, s);
    if (bar) bar.style.width = (secs / MAX * 100) + "%";
  }
  var holding = false;
  function startHold(ev) {
    if (holding) return;
    holding = true;
    if (ev && ev.preventDefault) ev.preventDefault();
    if (timer) clearInterval(timer);
    setBar(0);
    var t0 = Date.now();
    timer = setInterval(function () {
      setBar((Date.now() - t0) / 1000);
      if (secs >= MAX) endHold();
    }, 50);
  }
  function endHold() {
    if (!holding && !timer) return;
    holding = false;
    if (timer) clearInterval(timer);
    timer = null;
    if (st) st.textContent = "Recorded ~" + secs.toFixed(1) + "s · ready to post";
  }
  if (hold) {
    if (window.PointerEvent) {
      hold.addEventListener("pointerdown", startHold);
      hold.addEventListener("pointerup", endHold);
      hold.addEventListener("pointercancel", endHold);
      hold.addEventListener("pointerleave", endHold);
    } else {
      hold.addEventListener("mousedown", startHold);
      hold.addEventListener("mouseup", endHold);
      hold.addEventListener("mouseleave", endHold);
      hold.addEventListener("touchstart", startHold, { passive: false });
      hold.addEventListener("touchend", endHold);
      hold.addEventListener("touchcancel", endHold);
    }
  }
  if (post) {
    post.addEventListener("click", function () {
      if (secs < 0.3) secs = 3;
      var list = [];
      try { list = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) {}
      list.unshift({ caption: (cap && cap.value) || "untitled", secs: Math.min(MAX, Math.round(secs) || 6), ts: Date.now() });
      try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 40))); } catch (e2) {}
      var msg = "Vine posted · " + (Math.min(MAX, Math.round(secs) || 6)) + "s · " + KEY;
      if (st) st.textContent = msg;
      try {
        if (window.ITT && ITT._immersionApi && ITT._immersionApi.actionFeedback) {
          ITT._immersionApi.actionFeedback(msg, { status: st, kind: "vine" });
        }
      } catch (e3) {}
    });
  }
});
</script>
</body>
</html>
