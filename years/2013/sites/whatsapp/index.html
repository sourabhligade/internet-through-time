<!DOCTYPE html>

<body class="wa-shell">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div class="wa-phone">
 <div class="wa-header">WhatsApp</div>
 <div class="wa-chat">
  <div class="wa-bubble">Hey — still on WhatsApp in 2013?</div>
  <div class="wa-bubble">Yeah · cross-platform · not iMessage-only</div>
 </div>
 <div style="padding:0 12px 4px;font-size:12px;color:#555">

 </div>
 <button type="button" class="wa-btn" data-wa-seed>Note WhatsApp 2013 residual (theater)</button>

  <p class="itt13-ban"> · ban: 2020s channels UI as 2013 default</p>
 </div>
</div>
<p style="max-width:400px;margin:10px auto;font-size:11px;font-family:Helvetica,Arial,sans-serif">

<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt13-whatsapp";
  var b = document.querySelector("[data-wa-seed]");
  var st = document.querySelector("[data-wa-status]");
  if (!b) return;
  b.addEventListener("click", function () {
    try { localStorage.setItem(KEY, JSON.stringify({ residual: true, year: 2013, preFbDeal: true, ts: Date.now() })); } catch (e) {}
    if (st) st.textContent = "Saved · residual · pre-Facebook deal";
  });
});
</script>
