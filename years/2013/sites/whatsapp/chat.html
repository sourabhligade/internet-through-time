<!DOCTYPE html>
<html lang="en" data-itt-year="2013">
<head>
<meta charset="utf-8">
<title>WhatsApp chats — 2013</title>
<link rel="stylesheet" href="../../../../css/period-2013.css">
</head>
<body bgcolor="#e5ddd5">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:420px;margin:12px auto;font-family:Helvetica,Arial,sans-serif;background:#fff;border:1px solid #ccc">
 <div style="background:#075e54;color:#fff;padding:10px 12px;font-weight:bold">
  Chats
  <span style="float:right;font-size:11px;font-weight:normal">
   <a href="index.html" style="color:#cfc">Home</a> ·
   <a href="about.html" style="color:#cfc">About</a>
  </span>
 </div>
 <div data-wa13-list style="padding:10px;min-height:80px;font-size:13px;background:#e5ddd5"></div>
 <div style="padding:10px;border-top:1px solid #ccc">
  <form data-wa13-send>
   <label style="font-size:11px;display:block;margin-bottom:4px">To
    <select name="who" data-wa13-who>
     <option value="You">You (me)</option>
     <option value="Mom">Mom</option>
     <option value="Group · Family">Group · Family</option>
    </select>
   </label>
   <input name="text" data-wa13-text placeholder="Type a message" maxlength="200" style="width:70%">
   <button type="submit">Send</button>
  </form>
  <div data-wa13-status style="font-size:11px;margin-top:6px;color:#075e54"></div>
  <p style="font-size:11px;color:#555;margin-top:8px">
   Requires install · messages under <code>itt13-wa-chats</code> · pre-Facebook deal.
  </p>
 </div>
</div>
<script src="../../../../js/immersion-2013.js"></script>
<script>
(function () {
  var INST = "itt13-wa-installed";
  var CHATS = "itt13-wa-chats";
  function load() {
    try { return JSON.parse(localStorage.getItem(CHATS) || "[]") || []; } catch (e) { return []; }
  }
  function save(list) {
    localStorage.setItem(CHATS, JSON.stringify(list));
  }
  function render() {
    var list = load();
    var el = document.querySelector("[data-wa13-list]");
    if (!el) return;
    if (!list.length) {
      el.innerHTML = "<p style='font-size:12px;color:#555'>No messages yet.</p>";
      return;
    }
    el.innerHTML = list.slice().reverse().map(function (m) {
      return "<div style='background:#dcf8c6;margin:4px 0;padding:6px 8px;border-radius:4px;font-size:12px'><b>" +
        String(m.who || "").replace(/</g, "") + ":</b> " +
        String(m.text || "").replace(/</g, "&lt;") + "</div>";
    }).join("");
  }
  document.addEventListener("DOMContentLoaded", function () {
    var form = document.querySelector("[data-wa13-send]");
    var status = document.querySelector("[data-wa13-status]");
    var installed = false;
    try { installed = !!localStorage.getItem(INST); } catch (e0) {}
    if (!installed) {
      if (status) status.textContent = "Install WhatsApp first (home page).";
    }
    render();
    if (!form) return;
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (!installed) {
        if (status) status.textContent = "Install required before chat.";
        return;
      }
      var textEl = form.querySelector("[data-wa13-text], [name=text]");
      var whoEl = form.querySelector("[data-wa13-who], [name=who]");
      var text = (textEl && textEl.value || "").trim();
      if (!text) {
        if (status) status.textContent = "Type a message first (empty blocked).";
        return;
      }
      var list = load();
      list.push({ who: (whoEl && whoEl.value) || "You", text: text, ts: Date.now() });
      save(list);
      if (textEl) textEl.value = "";
      if (status) status.textContent = "Saved · " + list.length + " messages · itt13-wa-chats";
      render();
      try {
        if (window.ITT && ITT._immersionApi && ITT._immersionApi.markTourUsed) {
          ITT._immersionApi.markTourUsed();
        }
      } catch (e1) {}
    });
  });
})();
</script>
</body>
</html>
