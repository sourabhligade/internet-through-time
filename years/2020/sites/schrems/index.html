<h1>Privacy Shield is invalid</h1>
<p>CJEU · <b>16 Jul 2020</b> · Case <b>C-311/18</b> (Schrems II). The EU–US Privacy Shield decision falls. Standard Contractual Clauses can still work, with more work. This is not GDPR’s birthday (2018) and not CCPA (this year’s US statute).</p>
