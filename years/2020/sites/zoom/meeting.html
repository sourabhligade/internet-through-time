<!DOCTYPE html>
<html lang="en" data-itt-year="2020">
<head>
<meta charset="utf-8">
<title>Meeting — Zoom 2020</title>
<link rel="stylesheet" href="../../../../css/period-2020.css">

</head>
<body bgcolor="#ffffff" text="#000000" link="#0000ee" vlink="#551a8b" data-itt-year="2020">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<table width="720" align="center" cellpadding="10"><tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:13px">

<p><a href="index.html">← Join</a></p>
<h1>You’re muted</h1>
<section class="itt20-gallery" data-gallery>
  <figure data-self class="muted">You</figure>
  <figure>Host</figure>
  <figure>Class</figure>
  <figure>Kitchen</figure>
</section>
<div data-controls>
  <button type="button" class="itt20-mute" data-mute aria-pressed="true">Mute</button>
  <button type="button" class="itt20-video" data-video aria-pressed="false">Video</button>
  <button type="button" data-mute-all>Mute all</button>
  <button type="button" data-leave>Leave</button>
</div>
<form data-chat>
  <input name="line" maxlength="80" placeholder="can you see my screen">
  <button type="submit">Send</button>
</form>
<ol data-chat-log></ol>
<p data-itt-action-status style="min-height:1.2em;color:#060"></p>
<p style="font-size:11px;color:#555">Mute persists in this tab (session). Leave is blocked until you send chat. Recap is the save.</p>

</td></tr></table>
<script src="../../../../js/immersion-2020.js" defer></script>
</body>
</html>
