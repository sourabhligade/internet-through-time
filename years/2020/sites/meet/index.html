<h1>Meet is free. Teams hits 75 million DAU.</h1>
<p>April 29, 2020. Google made Meet free for everyone. Microsoft said Teams had <b>75 million daily active users</b>
 — up from 44 million in March. That is DAU. Zoom’s 300 million is participants. Zoom is still the one-thing.</p>
