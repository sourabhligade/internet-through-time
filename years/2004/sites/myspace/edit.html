<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Edit MySpace Profile</title>
<link rel="stylesheet" href="../../../../css/period-2004.css"></head>
<body bgcolor="#e5e5e5" link="#003399">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<table width="100%" cellpadding="6" bgcolor="#003399"><tr>
  <td><font face="Arial" color="#fff" size="2"><b>Edit Profile</b></font></td>
  <td align="right"><font face="Arial" size="2"><a href="index.html"><font color="#ffcc00">View Profile</font></a></font></td>
</tr></table>
<table width="580" align="center" cellpadding="12" bgcolor="#fff" style="margin-top:12px;border:1px solid #69c">
<tr><td>
<form data-myspace-edit>
<font face="Arial" size="2">
<b>Profile</b><br><br>
Display name: <input name="name" size="28" class="field9x"><br><br>
Mood: <input name="mood" size="16" class="field9x"><br><br>
Song (Now Playing): <input name="song" size="42" class="field9x"><br><br>
About me:<br><textarea name="about" rows="4" cols="50" class="field9x"></textarea><br><br>
Interests:<br><textarea name="interests" rows="2" cols="50" class="field9x"></textarea><br><br>
<hr>
<b>Theme (customize everything)</b><br><br>
Background: <input name="bg" size="10" class="field9x" value="#e5e5e5">
Accent: <input name="accent" size="10" class="field9x" value="#003399">
Text: <input name="text" size="10" class="field9x" value="#000000"><br><br>
Font:
<select name="font" class="field9x">
  <option>Arial</option>
  <option>Comic Sans MS</option>
  <option>Verdana</option>
  <option>Courier New</option>
  <option>Times New Roman</option>
</select>
<br><br>
<input type="submit" value="Save Profile" class="btn9x">
</font>
</form>
<p><font face="Arial" size="1"><a href="index.html">« View profile</a> · <a href="comments.html">Comments</a></font></p>
<div data-myspace-profile style="display:none" data-ms-theme-root>
<span data-ms-name></span><span data-ms-mood></span><span data-ms-song></span>
<span data-ms-about></span><span data-ms-interests></span><div data-ms-box></div>
</div>
</td></tr>
</table>
<script src="../../../../js/immersion-2004.js"></script>
</body></html>
