 <form data-gmail-compose class="gmail-compose-form">
  <label>To:</label>
  <input name="to" value="friend@example.com">
  <label>Subject:</label>
  <input name="subj" value="Have you got a Gmail invite?">
  <label>Message:</label>
  <textarea name="body">Hey —

I got into the Gmail preview (April 1 launch — people thought it was a joke).
1 gigabyte free. Search instead of folders. Conversations stay together.

Want an invite?

</textarea>
  <div class="gmail-compose-actions">
   <button type="submit">Send</button>
   <button type="button" onclick="history.back()">Discard</button>
   <button type="button" data-gmail-draft>Save Draft</button>
  </div>
 </form>
 <p data-gmail-compose-status style="font-size:12px;color:#060"></p>
 <p style="font-size:11px;color:#666;margin-top:10px">
  No real SMTP. Sent mail appears in Inbox in this browser only.
  Conversation threads · search, don't sort · no pop-up ads.
 </p>
