  <form data-gmail-compose class="gm04-compose">
    <font size="2">
    <table cellpadding="4">
    <tr><td align="right">To:</td><td><input name="to" size="48" placeholder="friend@example.com"></td></tr>
    <tr><td align="right">Subject:</td><td><input name="subject" size="48" placeholder="Subject"></td></tr>
    <tr><td align="right" valign="top">Message:</td>
        <td><textarea name="body" rows="12" cols="50" placeholder="Write your message…"></textarea></td></tr>
    <tr><td></td><td>
      <input type="submit" value="Send">
      <input type="button" value="Save Draft" data-gmail-draft>
      <input type="button" value="Discard" onclick="location.href='inbox.html'">
    </td></tr>
    </table>
    </font>
  </form>
  <p><font size="1">No attachment virus theater required — keep it 2004-simple.</font></p>
