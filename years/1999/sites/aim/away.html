<h2>Away Message</h2>
<p data-aim-session style="font-size:11px"></p>
<form data-aim-away-form>
<textarea data-ott-click="away-edit" id="away" name="away" rows="4" style="width:95%">at the library · brb · listen to [song]</textarea>
<p style="font-size:11px;margin:6px 0">Presets (museum lines — not full lyrics):
 <button type="button" data-aim-away-preset="brb — at the library · pager off">library</button>
 <button type="button" data-aim-away-preset="afk · dinner · leave a msg">dinner</button>
 <button type="button" data-aim-away-preset="out · try later · *waves*">out</button>
 <button type="button" data-aim-away-preset="away · homework · be back">homework</button>
</p>
<p><button type="submit" data-ott-click="away-set" class="ott-btn">Set as Away</button></p>
</form>
<p data-aim-status data-itt-action-status style="min-height:1.2em;font-size:12px;color:#060"></p>
<p style="font-size:11px">Sign on first. Away text is what IM auto-replies when a buddy is marked away.</p>
