<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IUMA — Request received</title>
<link rel="stylesheet" href="../../../../css/mosaic-defaults.css">
</head>
<body bgcolor="#000033" text="#FFFFFF" link="#FFFF00" vlink="#FF00FF" alink="#00FF00"
  data-echo-fields="b:#echo-band,e:#echo-email">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>

<p><a href="index.html">IUMA</a></p>
<h1>Thanks — request logged</h1>
<hr>
<p>
Band: <b id="echo-band"></b><br>
Contact: <span id="echo-email"></span>
</p>
<p>
In the real IUMA workflow you still had to <b>mail a tape</b> of original material.
Staff encoded MPEG Layer II by hand and built your band page later.
</p>
<p>
Your request has been received.
</p>
<p><a href="index.html">IUMA Home</a> · <a href="bands/index.html">Browse bands</a></p>
<script src="../../../../js/immersion.js"></script>
<script>
(function(){
  try {
    var b = (location.search.match(/[?&]b=([^&]*)/)||[])[1];
    var e = (location.search.match(/[?&]e=([^&]*)/)||[])[1];
    if (b || e) {
      var list = JSON.parse(localStorage.getItem('itt-iuma-subs')||'[]');
      list.unshift({band:decodeURIComponent((b||'').replace(/\+/g,' ')), email:decodeURIComponent((e||'').replace(/\+/g,' ')), date:new Date().toLocaleString()});
      localStorage.setItem('itt-iuma-subs', JSON.stringify(list.slice(0,20)));
    }
  } catch(err){}
})();
</script>
</body>
</html>
