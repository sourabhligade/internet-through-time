<h1>Manage preferences</h1>
<p>Strictly necessary stays on. Period banners often pre-checked analytics — this exhibit shows that dark pattern.</p>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-necessary disabled checked> Strictly necessary (always on)</label>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-analytics checked> Analytics (period pre-check)</label>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-ads checked> Advertising (period pre-check)</label>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-darkpattern> I see that <b>Accept All was bigger</b> than Manage</label>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-not-advice> This is <b>not legal advice</b></label>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-art15> Access (Art. 15)</label>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-art17> Erasure (Art. 17)</label>
<label style="display:block;margin:8px 0"><input type="checkbox" data-gdpr-date> Applies <b>25 May 2018</b>, not 2016 adoption</label>
<p><button type="button" data-gdpr-save>Save preferences</button></p>
<p data-itt-action-status data-gdpr-status style="min-height:1.2em;color:#060"></p>
<p style="font-size:11px;color:#555">Manage path · <code>itt18-gdpr</code> · Accept All on the banner does not write</p>
