 <h1 style="font-size:24px">Touch ID</h1>
 <p style="font-size:13px;font-weight:400;color:#3c3c43">iPhone 5s · September 2013 · fingerprint sensor in the Home button · pairs with <b>iOS 7</b>.</p>
 <div style="width:72px;height:72px;border-radius:36px;border:3px solid #c7c7cc;margin:20px auto;background:#fff;box-shadow:inset 0 0 0 8px #f2f2f7" title="RECON Home button — not Face ID"></div>
 <p style="font-size:12px;color:#8e8e93">Enroll theater · no real biometrics · not Face ID</p>
 <p>
  <button type="button" class="ios7-btn" data-touchid-enroll>Enroll fingerprint (theater)</button>
 </p>
 <div class="itt17-status" data-touchid-status></div>
 
</div>

<div style="margin:12px 0;padding:10px;border:1px solid #888;background:#f8f8f0;font-family:Arial,sans-serif;max-width:520px">
 <b>Multi-step REAL — Touch ID</b>
  <label style="display:block;margin:4px 0;font-size:12px"><input type="checkbox" data-req> Fingerprint sensor literacy (5s)</label>
  <label style="display:block;margin:4px 0;font-size:12px"><input type="checkbox" data-req> No real biometrics / Secure Enclave</label>
 <p style="margin-top:8px">
  <button type="button" data-itt-real-save data-storage-key="touchid" data-min-checks="2" data-req="[data-req]">Save (REAL)</button>
  <span data-itt-real-status style="font-size:12px;margin-left:8px"></span>
 </p>
 <p style="font-size:11px;color:#666">Both checks required · incomplete writes nothing · <code>itt17-touchid</code></p>
