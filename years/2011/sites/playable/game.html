<!DOCTYPE html>
<html lang="en" data-itt-year="2011">
<head>
<meta charset="utf-8">
<title>Letter Swap — 2011</title>
<link rel="stylesheet" href="../../../../css/period-2011-lite.css">
<link rel="stylesheet" href="../../../../css/year-game-ui.css">
<style>
.itt-year-game{max-width:440px;margin:0 auto;padding:12px;font-family:Segoe UI,Arial,sans-serif;font-size:13px}
.honesty{font-size:11px;background:#eef;border:1px solid #66a;padding:6px;margin:8px 0}
</style>
</head>
<body class="yg-body yg-year-2011" bgcolor="#fafafa">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div class="itt-year-game yg-shell" data-year-game data-year="2011" data-game-id="letterswap">
  <h1>Letter Swap — 2011</h1>
  <p><b>Complex:</b> ~900-word dictionary · Scrabble-ish bag · tile click · shuffle · 7-letter bingo · 2-minute rounds.</p>
  <p class="honesty yg-honesty">Social word-game class · museum original · key <code>itt11-game-letterswap</code> · dict size <b data-dict-size>?</b></p>
  <p>
    <button type="button" data-game-start>Start</button>
    <button type="button" data-shuffle>Shuffle rack</button>
    Time <b data-game-time>120</b> · Score <b data-game-score>0</b> · Best <b data-game-best>0</b>
  </p>
  <div data-rack style="min-height:48px;margin:8px 0"></div>
  <p>
    <input data-word type="text" maxlength="12" placeholder="type word" style="font-size:16px;padding:4px 8px">
    <button type="button" data-play-word>Play word</button>
  </p>
  <p style="font-size:11px;max-height:60px;overflow:auto">Found: <span data-found></span></p>
  <p data-itt-action-status>Press Start</p>
  <p style="font-size:11px"><a href="index.html">← Playables</a></p>
</div>
<script src="../../../../js/games/year-game-boot.js"></script>
<script src="../../../../js/games/data/words-en-lite.js"></script>
<script src="../../../../js/games/year-2011-letterswap.js"></script>
<script src="../../../../js/immersion-2011.js" defer></script>
</body>
</html>
