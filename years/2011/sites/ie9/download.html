<!DOCTYPE html>
<html lang="en" data-itt-year="2011">
<head>
<meta charset="utf-8">
<title>Download Internet Explorer 9</title>
<link rel="stylesheet" href="../../../../css/period-2011.css">
<script src="../../../../js/immersion-2011.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var btn = document.querySelector("[data-ie9-download]");
  var st = document.querySelector("[data-ie9-status]");
  function show() {
    try {
      if (localStorage.getItem("itt11-ie9") && st) {
        st.innerHTML = "IE 9 marked <b>installed</b> (this browser only · museum theater).";
      }
    } catch (e) {}
  }
  show();
  if (btn) {
    btn.addEventListener("click", function (ev) {
      ev.preventDefault();
      var os = document.querySelector("[data-ie9-os]");
      var ch = document.querySelector("[data-ie9-not-chrome]");
      if (!os || !os.checked || !ch || !ch.checked) {
        if (st) st.textContent = "Confirm Vista/7 + not Chrome-default first.";
        return;
      }
      try {
        localStorage.setItem("itt11-ie9", JSON.stringify({
          installed: true, real: true, multiStep: true, year: "2011", os: "vista-7", ts: Date.now()
        }));
      } catch (e2) {}
      show();
      if (st) st.innerHTML = "Download complete · IE 9 ready · no real installer ran.";
    });
  }
});
</script>
</head>
<body bgcolor="#ffffff">

  <p data-ie9-status style="font-size:12px;margin-top:10px"></p>
 </div>

</div>
