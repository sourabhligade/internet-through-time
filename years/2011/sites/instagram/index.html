<!DOCTYPE html>
<html lang="en" data-itt-year="2011">
<head>
<meta charset="utf-8">
<title>Instagram</title>
<link rel="stylesheet" href="../../../../css/period-2011.css">
<link rel="stylesheet" href="../../../../css/period-2012.css">
<script src="../../../../js/immersion-2011.js" defer></script>
</head>
<body class="ig-app-body">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div class="ig-phone">
  <div class="ig-status-fake">AT&amp;T · 9:41 AM · 100%</div>
  <header class="ig-app-bar">
    <span class="ig-cam">⊕</span>
    <span class="ig-wordmark">Instagram</span>
    <span class="ig-dm">✉</span>
  </header>
  <div class="ig-subnav">
    <span style="color:#517fa4">iOS only · 2011</span> ·
    <a href="filters.html">Filters</a> ·
    <a href="about.html">About</a>
  </div>
  <div class="ig-compose-card">
    <div class="ig-stage" data-ig-stage>
      <div class="ig-stage-photo" data-ig-photo></div>
      <div class="ig-stage-label"><span data-ig-filter-label>Normal</span></div>
    </div>
    <div class="ig-filters-row">
      <button type="button" class="ig-f is-on" data-ig-filter="Normal">Normal</button>
      <button type="button" class="ig-f" data-ig-filter="X-Pro II">X-Pro II</button>
      <button type="button" class="ig-f" data-ig-filter="Earlybird">Earlybird</button>
      <button type="button" class="ig-f" data-ig-filter="Toaster">Toaster</button>
      <button type="button" class="ig-f" data-ig-filter="Brannan">Brannan</button>
    </div>
    <input type="text" data-ig-caption class="ig-caption" placeholder="Write a caption…">
    <button type="button" data-ig-share class="ig-share-btn" style="background:#517fa4">Share</button>
    <div data-ig-status class="ig-status"></div>
  </div>
  <div class="ig-feed-label">Feed</div>
  <div data-ig-feed class="ig-feed"></div>
  <nav class="ig-tabbar">
    <span class="is-on">⌂</span><span>🔍</span><span>＋</span><span>♡</span><span>○</span>
  </nav>
</div>
<script>
(function () {
  document.addEventListener("DOMContentLoaded", function () {
    var filter = "Normal";
    var photo = document.querySelector("[data-ig-photo]");
    var flabel = document.querySelector("[data-ig-filter-label]");
    var fbtns = document.querySelectorAll("[data-ig-filter]");
    var FILTERS = {
      Normal: "none",
      "X-Pro II": "contrast(1.25) saturate(1.35) hue-rotate(-10deg)",
      Earlybird: "sepia(0.45) contrast(1.1) brightness(1.05)",
      Toaster: "sepia(0.35) contrast(1.3) brightness(0.95) saturate(1.4)",
      Brannan: "sepia(0.3) contrast(1.2) brightness(1.05) saturate(0.9)"
    };
    function applyFilter(name) {
      filter = name;
      if (flabel) flabel.textContent = name;
      if (photo) photo.style.filter = FILTERS[name] || "none";
      for (var i = 0; i < fbtns.length; i++) {
        fbtns[i].classList.toggle("is-on", fbtns[i].getAttribute("data-ig-filter") === name);
      }
    }
    for (var i = 0; i < fbtns.length; i++) {
      fbtns[i].addEventListener("click", function (ev) {
        applyFilter(ev.currentTarget.getAttribute("data-ig-filter") || "Normal");
      });
    }
    applyFilter("Normal");
  });
})();
</script>
</body>
</html>
