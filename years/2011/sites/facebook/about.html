  <p>
  <button type="button" data-fb-culture>Note Social Network film (theater)</button>
  <span data-fb-culture-status style="font-size:12px;color:#060;margin-left:8px"></span>
 </p>
 <p style="font-size:12px"><code>itt11-fb-likes</code> · <code>itt11-fb-culture</code></p>
<script>
(function(){
  var KEY="itt11-fb-culture";
  function boot(){
    var b=document.querySelector("[data-fb-culture]");
    var st=document.querySelector("[data-fb-culture-status]");
    if(!b) return;
    b.addEventListener("click", function(){
      try{ localStorage.setItem(KEY, JSON.stringify({film:true,year:2010,ts:Date.now()})); }catch(e){}
      if(st) st.textContent="Noted · "+KEY;
    });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
