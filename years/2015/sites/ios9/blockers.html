<p>Enable path: <b>Settings → Safari → Content Blockers</b>. Period apps class: 1Blocker · Crystal · Blockr.</p>
<label style="display:block"><input type="checkbox" data-blocker-app data-blocker-id="1blocker"> Install 1Blocker class app</label>
<label style="display:block"><input type="checkbox" data-blocker-app data-blocker-id="crystal"> Install Crystal class app</label>
<label style="display:block"><input type="checkbox" data-blocker-path> Open Settings → Safari → Content Blockers</label>
<label style="display:block"><input type="checkbox" data-blocker-enable> Toggle blocker ON</label>
<p><button type="button" data-blocker-save style="padding:8px 12px;margin-top:10px">Enable blockers · save</button></p>
