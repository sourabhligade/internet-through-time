<!DOCTYPE html>
<html lang="en" data-itt-year="2015">
<head>
<meta charset="utf-8">
<title>Snapchat Stories — October 2013</title>
<link rel="stylesheet" href="../../../../css/period-2015.css">
<link rel="stylesheet" href="../../../../css/phone-frame.css">
<script src="../../../../js/immersion-2015.js" defer></script>
</head>
<body class="snap-shell">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<p style="font-size:11px"><a href="index.html">← Snapchat</a> · <a href="../../pages/home.html">Start</a></p>
<div class="itt-phone itt-phone-4">
<div class="itt-phone-status"><span>LTE</span><span>9:41 PM</span><span>87%</span></div>
<div class="itt-phone-screen" style="background:#000;color:#fff;padding:10px">
<h1 style="font-size:20px;color:#fffc00;margin:4px 0 8px">My Story</h1>
<p style="color:#aaa;font-size:11px;margin:0 0 8px">
 <b style="color:#fffc00">October 3, 2013</b> — chain snaps for <b style="color:#fffc00">24 hours</b>.
 Not Instagram Stories (2016).
</p>
<div class="snap-cam">📷 camera · add to Story</div>
<div class="snap-story-rail" data-snap-story-rail>My Story · empty · add a snap</div>
<p style="font-size:11px;margin:10px 0">
 <label><input type="checkbox" data-snap-not-ig> Not Instagram Stories (that’s 2016)</label>
</p>
<p style="font-size:11px;margin:10px 0">
 <label><input type="checkbox" data-snap-24h> Stories last <b>24 hours</b></label>
</p>
<p>
 <button type="button" class="snap-cta" data-snap-story-add>Add snap to My Story</button>
</p>
<div class="itt15-status" data-snap-story-status></div>
<p class="itt15-ban" style="color:#555;font-size:10px">24h Story · unlimited rewatches until expiry</p>
</div>
<div class="itt-phone-home" aria-hidden="true"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "itt15-snap-story";
  var rail = document.querySelector("[data-snap-story-rail]");
  var st = document.querySelector("[data-snap-story-status]");
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { return []; }
  }
  function render() {
    var list = load();
    if (!rail) return;
    if (!list.length) {
      rail.textContent = "My Story · empty · add a snap";
      return;
    }
    var now = Date.now();
    var bits = list.slice(0, 8).map(function (s) {
      var exp = s.expires || (s.ts + 86400000);
      var left = exp - now;
      if (left <= 0) return "<div data-snap-expired>expired · 24h residual (museum clock)</div>";
      var h = Math.max(0, Math.floor(left / 3600000));
      return "<div>snap · ~" + h + "h left · 24h residual</div>";
    });
    rail.innerHTML = "My Story · " + list.length + " snap(s) · 24h theater<br>" + bits.join("");
  }
  render();
  var btn = document.querySelector("[data-snap-story-add]");
  if (btn) {
    btn.addEventListener("click", function () {
      var ack = document.querySelector("[data-snap-not-ig]");
      var h24 = document.querySelector("[data-snap-24h]");
      if (!ack || !ack.checked || !h24 || !h24.checked) {
        if (st) st.textContent = "Check: 24h + not Instagram Stories (2016) first.";
        return;
      }
      var list = load();
      var ts = Date.now();
      list.unshift({ kind: "snap", hours: 24, ts: ts, expires: ts + 86400000, multiStep: true });
      try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 24))); } catch (e) {}
      render();
      var msg = "Added to My Story · 24h residual";
      if (st) st.textContent = msg;
      try {
        if (window.ITT && ITT._immersionApi && ITT._immersionApi.actionFeedback) {
          ITT._immersionApi.actionFeedback(msg, { status: st, kind: "snap-story" });
        }
      } catch (e2) {}
    });
  }
});
</script>
</body>
</html>
