<!DOCTYPE html>

<body bgcolor="#f0f0f0">
<div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div>
<div style="max-width:720px;margin:12px auto;font-family:Arial,sans-serif;font-size:13px;background:#fff;border:1px solid #ccc;padding:12px">
 <p style="font-size:12px;margin:0 0 8px">
  <a href="index.html">← Docs home</a> · <a href="about.html">About</a>
 </p>
 <form data-docs-save>
  <div style="margin-bottom:8px">
   Title: <input name="title" data-docs-title size="40" style="font-size:14px;font-weight:bold">
  </div>
  <div style="border:1px solid #999;background:#fff;padding:4px">
   <textarea name="body" data-docs-body rows="14" style="width:98%;border:0;font-family:Georgia,serif;font-size:14px;line-height:1.5"></textarea>
  </div>
  <p style="margin:10px 0 0">
   <button type="submit">Save</button>
   <span data-docs-status style="color:#060;font-size:12px;margin-left:8px"></span>
  </p>
 </form>
 <p style="font-size:11px;color:#666;margin-top:12px">
  Collaborative web office — multiple people can “share” this document in local theater.

 </p>
