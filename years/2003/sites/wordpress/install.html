<!DOCTYPE html><html lang="en" data-itt-year="2003"><head><meta charset="utf-8"><title>WordPress install</title><link rel="stylesheet" href="../../../../css/period-2003.css"></head><body bgcolor="#fff" text="#111" link="#003399" vlink="#551a8b"><div id="itt-nav-slot" class="itt-nav-slot" aria-hidden="true"></div><p class="crumb"><a href="index.html">WordPress</a> · <a href="dashboard.html">Dashboard</a></p><h1>Install wizard</h1><div data-wp-install-root><p>Step <b data-wp-step-num>1</b> of 3</p><div data-wp-step="1"><p>Create wp-config. Both boxes start empty. Unticked Next writes nothing.</p><p><label><input type="checkbox" data-wp-install-req> PHP and MySQL stay in this browser</label><br><label><input type="checkbox" data-wp-install-req> This is not a real host password</label></p><p><button type="button" data-wp-next>Next</button></p></div><div data-wp-step="2" style="display:none"><p>Blog title and database. Empty fields never write. The password is not stored.</p><p>Blog title<br><input name="blog" size="24" maxlength="80" autocomplete="off"><br>DB name<br><input name="db" size="16" autocomplete="off"><br>User<br><input name="user" size="16" autocomplete="off"><br>Password<br><input name="pass" type="password" size="16" autocomplete="off"></p><p><button type="button" data-wp-next>Next</button></p></div><div data-wp-step="3" style="display:none"><p>Installed (this browser only).</p></div><p data-wp-install-status></p></div><script src="../../../../js/immersion-2003.js"></script></body></html>
